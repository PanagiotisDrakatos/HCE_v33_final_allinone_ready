name: CI

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Only permission any lane needs. Fork PRs get the same read-only token; no
# step uses a secret, so forks run every check on merit.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  UV_VERSION: "0.12.17"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ensure Node (act only)
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update && apt-get install -y nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
      - name: Set up uv venv
        run: |
          pipx install "uv==$UV_VERSION" || pipx upgrade uv
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - run: uv pip install -r requirements-dev.txt
      - run: ruff check --output-format=github --force-exclude .
      - run: ruff format --check .

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Ensure Node (act only)
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update && apt-get install -y nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
      - name: Set up uv venv
        run: |
          pipx install "uv==$UV_VERSION" || pipx upgrade uv
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - run: uv pip install -r requirements.txt -r requirements-dev.txt -e .
      # pytest.ini owns --cov=hcebt --cov=lib --cov-fail-under=85; do not override.
      - run: pytest -m "not integration"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-coverage
          path: coverage.xml
          if-no-files-found: warn

  pr-policy:
    name: pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set git identity for the merge test
        if: github.event_name == 'pull_request'
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
      - name: Ensure PR merges cleanly into base
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          mkdir -p ci_logs
          echo "Base: $GITHUB_BASE_REF  Head: $GITHUB_HEAD_REF" | tee ci_logs/pr-guard.merge.txt
          git fetch origin "$GITHUB_BASE_REF" "$GITHUB_HEAD_REF"
          git checkout -b pr-merge-test "origin/$GITHUB_BASE_REF"
          if ! git merge --no-commit --no-ff "origin/$GITHUB_HEAD_REF"; then
            echo "::error::PR cannot be merged cleanly into ${GITHUB_BASE_REF}. Please rebase." | tee -a ci_logs/pr-guard.merge.txt
            exit 1
          fi
          echo "Clean merge test passed." | tee -a ci_logs/pr-guard.merge.txt
      - name: Check branch is not behind base
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          git fetch origin "$GITHUB_BASE_REF"
          BEHIND=$(git rev-list --count HEAD.."origin/$GITHUB_BASE_REF")
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::Branch is $BEHIND commits behind ${GITHUB_BASE_REF}. Please rebase/merge."
            exit 1
          fi
      - name: Disallow merge commits in PR history
        if: github.event_name == 'pull_request'
        run: |
          set -euxo pipefail
          git fetch origin "$GITHUB_BASE_REF"
          MERGES=$(git rev-list --merges --count "origin/$GITHUB_BASE_REF"..HEAD)
          if [ "$MERGES" -gt 0 ]; then
            echo "::error::PR contains merge commits. Please rebase on ${GITHUB_BASE_REF}."
            exit 1
          fi
      - name: Forbid Windows-only files & non-Ruff linters
        run: |
          set -euxo pipefail
          if git ls-files -z | grep -E -z '\.(cmd|bat|ps1)$'; then
            echo "::error::Windows-only scripts (*.cmd|*.bat|*.ps1) are not allowed."
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(\.flake8|pylintrc|pylint\.ini|\.pylintrc|black\.toml)$'; then
            echo "::error::Found disallowed config files (black/flake8/pylint). Use Ruff only."
            exit 1
          fi
          if git ls-files --error-unmatch pyproject.toml >/dev/null 2>&1; then
            if grep -nE '^\[tool\.(black|flake8|pylint)\]' pyproject.toml >/dev/null 2>&1; then
              echo "::error::pyproject.toml contains black/flake8/pylint tool config. Use Ruff only."
              exit 1
            fi
          fi
          if git grep -nE '\b(black|flake8|pylint|isort)\b' -- . ':(exclude)README*' ':(exclude)*.md' ':(exclude)pyproject.toml' ':(exclude)scripts/**' ':(exclude).github/**' ':(exclude).prompts/**' ':(exclude)verification/**'; then
            echo "::error::Found disallowed linters/configs (black/flake8/pylint/isort). Use Ruff only."
            exit 1
          fi
          echo "Policy checks passed."

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ensure Node (act only)
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update && apt-get install -y nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
      - name: Set up uv venv
        run: |
          pipx install "uv==$UV_VERSION" || pipx upgrade uv
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      # Blocking: bandit HIGH severity AND HIGH confidence, pip-audit when a fix
      # version exists. One policy, shared with scripts/verify.py security.
      - run: python scripts/verify.py security

  runtime-verify:
    name: runtime-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Ensure Node (act only)
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update && apt-get install -y nodejs npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
      - name: Runner facts
        run: docker compose version
      - name: Set up uv venv
        run: |
          pipx install "uv==$UV_VERSION" || pipx upgrade uv
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      # No `-e .` here: it regenerates the tracked hcebt.egg-info and would
      # dirty the tree before the receipt binds it. backtest.py runs from the
      # repo root, so hcebt imports from source without an editable install.
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Runtime proof + receipt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/verify.py runtime
          python scripts/verify.py receipt
      - name: Tear down (always)
        if: always()
        run: |
          docker compose -f docker-compose.yml -f compose.verify.yml down -v --remove-orphans || true
          python scripts/verify.py clean || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-receipt
          path: .verify/receipt.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [static, unit, pr-policy, security, runtime-verify]
    # Run even when a lane fails, then check each result explicitly: a skipped,
    # cancelled, or failed lane must not read as success.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Every lane must be success
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(r)
          want = {"static", "unit", "pr-policy", "security", "runtime-verify"}
          bad = sorted(k for k in want if r.get(k) != "success")
          sys.exit(f"lanes not success: {bad}" if bad else 0)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verify-receipt
          path: receipt-artifact
      - name: Receipt is PASS, schema-valid, bound to this tree, runtime-proven
        run: |
          python3 scripts/verify.py check \
            --receipt receipt-artifact/receipt.json \
            --expect-repo "$GITHUB_REPOSITORY" \
            --expect-tree "$(git rev-parse HEAD^{tree})" \
            --require-clean --require-feature timescale-roundtrip
