services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    environment:
      - CLICKHOUSE_DB=hce
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - ./persistence/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  timescaledb:
    # Pinned by digest: the former tag `timescaledb-ha:pg16-latest` was removed
    # from Docker Hub (404). The non-HA image is enough; init.sql only runs
    # `CREATE EXTENSION timescaledb`. Update via `docker manifest inspect`.
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=hce
    ports: ["5432:5432"]
    volumes:
      - ./persistence/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
